name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # -------------------------------------------------------------
  # Job 1: CI (Continuous Integration) - Lint & Build verification
  # -------------------------------------------------------------
  test-and-build:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Library (tsup)
        run: npm run build:lib

      - name: Build Demo App (next build)
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: CD (Continuous Deployment) - Publish to NPM
  # Only triggers on push to main or manual dispatch
  # -------------------------------------------------------------
  publish-npm:
    name: Publish to NPM Registry
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check version & Publish to NPM
        id: publish
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Current package: $PACKAGE_NAME@$CURRENT_VERSION"

          # Check if this exact version is already published on npm
          REMOTE_VERSION=$(npm view "$PACKAGE_NAME@$CURRENT_VERSION" version 2>/dev/null || echo "")

          if [ "$CURRENT_VERSION" != "$REMOTE_VERSION" ]; then
            echo "🚀 Version $CURRENT_VERSION is new. Publishing to npm..."
            npm publish --access public --provenance
            echo "✅ Successfully published $PACKAGE_NAME@$CURRENT_VERSION to npm!"
          else
            echo "ℹ️ Version $CURRENT_VERSION is already published on npm. Bump version in package.json to release a new version."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
